<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A fast, friendly Kanban board for small teams. Create tasks, drag them across your workflow, and keep everyone in sync." />
    <meta name="theme-color" content="#5b5bd6" />
    <title>Kanban Board — Team task board</title>
    <script>
      try {
        var stored = localStorage.getItem('kanban-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
